<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense & Budget</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ── Header ── -->
    <header>
      <h3>Expense &amp; Budget</h3>
      <button id="btn-sun" aria-label="Switch to light mode">
        <img
          id="icon-sun"
          src="https://img.icons8.com/?size=100&id=648&format=png&color=000000"
          alt="Sun"
        />
      </button>
      <button id="btn-moon" aria-label="Switch to dark mode">
        <img
          id="icon-moon"
          src="https://img.icons8.com/?size=100&id=26031&format=png&color=000000"
          alt="Moon"
        />
      </button>
    </header>

    <!-- ── Balance ── -->
    <section class="balance">
      <p class="balance-label">Total Spending</p>
      <h1 id="balance-display">$0.00</h1>
    </section>

    <!-- ── Add Transaction ── -->
    <section class="forms">
      <h3>Add Transaction</h3>
      <form id="transaction-form">
        <div class="field">
          <label for="input-name">Item Name</label>
          <input
            id="input-name"
            type="text"
            placeholder="e.g. Lunch, Coffee..."
            autocomplete="off"
            required
          />
        </div>

        <div class="field">
          <label for="input-amount">Amount ($)</label>
          <input
            id="input-amount"
            type="number"
            placeholder="0.00"
            min="0.01"
            step="0.01"
            required
          />
        </div>

        <div class="field">
          <label for="input-category">Category</label>
          <select id="input-category" required>
            <option value="" disabled selected>Select category</option>
            <option>Food</option>
            <option>Transport</option>
            <option>Fun</option>
          </select>
        </div>

        <div class="field">
          <label for="input-new-category">New Category (optional)</label>
          <input
            id="input-new-category"
            type="text"
            placeholder="Add a custom category..."
          />
        </div>

        <button type="submit" class="btn-submit">Add Transaction</button>
      </form>
    </section>

    <!-- ── Transaction History ── -->
    <section class="transac-list">
      <div class="transac-list-header">
        <h3>History</h3>
        <select id="filter-category" aria-label="Filter by category">
          <option value="all">All</option>
        </select>
      </div>
      <div id="transaction-container">
        <!-- items injected by JS -->
      </div>
      <p id="empty-state" class="empty-state">
        No transactions yet. Add one above!
      </p>
    </section>

    <!-- ── Spending Chart ── -->
    <section class="spending">
      <h3>Spending by Category</h3>
      <div id="chart-wrap">
        <canvas
          id="pie-chart"
          width="220"
          height="220"
          aria-label="Spending pie chart"
        ></canvas>
        <ul id="chart-legend" aria-label="Chart legend"></ul>
      </div>
      <p id="chart-empty" class="empty-state">No expense data to display.</p>
    </section>

    <script src="js/script.js"></script>
  </body>
</html>
